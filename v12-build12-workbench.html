let VS=1, VX=0, VY=0;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const cw=window.innerWidth, ch=window.innerHeight;
  cv.width=Math.floor(cw*dpr); cv.height=Math.floor(ch*dpr);
  VS=Math.min(cw/W, ch/H); VX=(cw-W*VS)/2; VY=(ch-H*VS)/2;
  g.setTransform(dpr,0,0,dpr,0,0);
  g.imageSmoothingEnabled=false;
}
window.addEventListener('resize',resize);

/* ---------------- utils ---------------- */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const inRect=(px,py,r)=>px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h;
function hash(n){ n=(n<<13)^n; return 1-((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/1073741824; }

const FONT='"Silkscreen","Courier New",monospace';
function txt(s,x,y,size,col,align,weight){
  g.font=(weight||'bold')+' '+size+'px '+FONT;
  g.textAlign=align||'left'; g.textBaseline='middle'; g.fillStyle=col||'#efe3cb';
  g.fillText(s,Math.round(x),Math.round(y));
}
function txtw(s,size,weight){
  g.font=(weight||'bold')+' '+size+'px '+FONT;
  return g.measureText(s).width;
}
function fitText(s,maxw,size,weight){
  g.font=(weight||'bold')+' '+size+'px '+FONT;
  if(g.measureText(s).width<=maxw) return s;
  let t=s;
  while(t.length>1 && g.measureText(t).width>maxw) t=t.slice(0,-1);
  return t;
}
function wrapText(s,x,y,maxw,lh,size,col){
  g.font='normal '+size+'px '+FONT;
  const words=s.split(' '); let line='', yy=y;
  for(const w of words){
    const t=line?line+' '+w:w;
    if(g.measureText(t).width>maxw){ txt(line,x,yy,size,col,'left','normal'); line=w; yy+=lh; }
    else line=t;
  }
  txt(line,x,yy,size,col,'left','normal');
  return yy;
}

/* ---------------- pixel engine ---------------- */
function makeCanvas(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false; return c;
}
function spriteFrom(rows,pal){
  const h=rows.length, w=rows[0].length, c=makeCanvas(w,h), x=c.getContext('2d');
  for(let y=0;y<h;y++) for(let i=0;i<w;i++){
    const col=pal[rows[y][i]];
    if(col){ x.fillStyle=col; x.fillRect(i,y,1,1); }
  }
  return c;
}
function blit(spr,dx,dy,scale,alpha){
  if(!spr) return;
  g.imageSmoothingEnabled=false;
  if(alpha!==undefined) g.globalAlpha=alpha;
  g.drawImage(spr, Math.round(dx), Math.round(dy), spr.width*scale, spr.height*scale);
  if(alpha!==undefined) g.globalAlpha=1;
}
function blitC(spr,cx,cy,scale,alpha){
  if(!spr) return;
  blit(spr, cx-spr.width*scale/2, cy-spr.height*scale/2, scale, alpha);
}
/* hard-edged UI plate, chamfered corners, no antialiasing */
function plate(x,y,w,h,fill,edge,hi){
  x=Math.round(x); y=Math.round(y); w=Math.round(w); h=Math.round(h);
  const k=3;
  g.fillStyle=edge||C.edge;
  g.fillRect(x+k,y,w-k*2,h); g.fillRect(x,y+k,w,h-k*2);
  g.fillRect(x+1,y+1,k,k); g.fillRect(x+w-k-1,y+1,k,k);
  g.fillRect(x+1,y+h-k-1,k,k); g.fillRect(x+w-k-1,y+h-k-1,k,k);
  g.fillStyle=fill||C.plate;
  g.fillRect(x+k+2,y+2,w-(k+2)*2,h-4); g.fillRect(x+2,y+k+2,w-4,h-(k+2)*2);
  if(hi){ g.fillStyle=hi; g.fillRect(x+k+2,y+2,w-(k+2)*2,2); }
}
function bar(x,y,w,h,k,col,bg){
  x=Math.round(x); y=Math.round(y); w=Math.round(w); h=Math.round(h);
  g.fillStyle=bg||'#120d0a'; g.fillRect(x,y,w,h);
  g.fillStyle=col; g.fillRect(x+2,y+2,Math.max(0,Math.round((w-4)*clamp(k,0,1))),h-4);
}

/* ---------------- audio ---------------- */
const Snd={
  ctx:null,on:true,
  init(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } },
  tone(f,dur,type,vol,f2){
    if(!this.on||!this.ctx) return;
    const t=this.ctx.currentTime,o=this.ctx.createOscillator(),gn=this.ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
    gn.gain.setValueAtTime(0.0001,t);
    gn.gain.exponentialRampToValueAtTime(vol||0.07,t+0.012);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(gn); gn.connect(this.ctx.destination); o.start(t); o.stop(t+dur+0.02);
  },
  grab(){ this.tone(320,0.06,'square',0.05,420); },
  drop(){ this.tone(200,0.08,'square',0.05,150); },
  good(){ this.tone(660,0.08,'square',0.06,990); setTimeout(()=>this.tone(990,0.09,'square',0.05),55); },
  bad(){ this.tone(150,0.2,'sawtooth',0.07,70); },
  coin(n){ const b=520+Math.min(n,8)*55; this.tone(b,0.07,'triangle',0.09,b*1.5);
           setTimeout(()=>this.tone(b*1.5,0.09,'triangle',0.07,b*2),55); },
  horn(){ this.tone(140,0.5,'sawtooth',0.07,110); setTimeout(()=>this.tone(180,0.55,'sawtooth',0.06,140),160); },
  angry(){ this.tone(220,0.28,'sawtooth',0.08,90); },
  tick(){ this.tone(900,0.03,'square',0.025); },
  ui(){ this.tone(440,0.05,'square',0.05,560); }
};

/* ================================================================
   CHARACTERS - procedural pixel sprites, 22x32
   ================================================================ */
function drawChar(cfg){
  const cvs=makeCanvas(22,32), x=cvs.getContext('2d');
  const px=(a,b,w,h,col)=>{ x.fillStyle=col; x.fillRect(a,b,w,h); };
  const sk=cfg.skin||'#c79b6e', co=cfg.coat||'#8a7a52', cd=cfg.coat2||shade(co,-30),
        pa=cfg.pants||'#3a3229', ac=cfg.accent||'#5a4330', bl='#1a1410';
  const build=cfg.build||'norm';
  let tx,tw,ty,tb,hx,hy,hw,hh;
  if(build==='big'){ tx=4;tw=14;ty=11;tb=26; hx=8;hy=4;hw=7;hh=8; }
  else if(build==='small'){ tx=8;tw=7;ty=17;tb=26; hx=8;hy=10;hw=7;hh=8; }
  else if(build==='hunch'){ tx=5;tw=12;ty=14;tb=26; hx=11;hy=8;hw=8;hh=8; }
  else if(build==='robe'){ tx=7;tw=9;ty=12;tb=31; hx=8;hy=5;hw=7;hh=8; }
  else { tx=7;tw=9;ty=12;tb=25; hx=8;hy=5;hw=7;hh=8; }

  // behind-props
  if(cfg.props&&cfg.props.indexOf('backpack')>=0) px(tx-3,ty+2,4,9,shade(ac,-10));
  if(cfg.props&&cfg.props.indexOf('roboarm')>=0){      /* the mount sits behind the back */
    px(tx+tw-2,ty-3,6,9,'#6b4f2a'); px(tx+tw+2,ty-3,2,9,'#8a6a3a');
  }
  if(cfg.props&&cfg.props.indexOf('rifleback')>=0){
    px(tx+tw,ty-4,1,14,'#3a3129'); px(tx+tw-1,ty-5,3,2,'#6b6258');
  }
  if(cfg.props&&cfg.props.indexOf('rats')>=0){
    for(let i=0;i<7;i++){
      const rx=2+((i*7)%17), ry=22+((i*5)%8);
      px(rx,ry,4,3,'#4a3a30'); px(rx+3,ry,1,1,'#a8443a'); px(rx+1,ry+1,1,1,'#e8d27a');
    }
  }
  // shadow
  px(4,31,14,1,'rgba(0,0,0,0.45)');
  // legs
  if(build!=='robe'){
    const lw=build==='big'?4:3, l1=tx+1, l2=tx+tw-lw-1;
    px(l1,tb,lw,31-tb,pa); px(l2,tb,lw,31-tb,pa);
    px(l1,30,lw,1,bl); px(l2,30,lw,1,bl);
  }
  // torso
  if(build==='robe'){
    for(let yy=ty; yy<=31; yy++){
      const k=(yy-ty)/(31-ty), w=Math.round(tw+k*7);
      px(Math.round(11-w/2),yy,w,1, yy%3===0?cd:co);
    }
  } else if(build==='big'){
    px(tx,ty,tw,tb-ty,co);
    px(tx+2,ty+5,tw-4,8,shade(co,18));   // belly
    px(tx+tw-3,ty,3,tb-ty,cd);
  } else {
    px(tx,ty,tw,tb-ty,co);
    px(tx+tw-2,ty,2,tb-ty,cd);
    if(cfg.coatOpen){ px(tx+Math.floor(tw/2)-1,ty+2,2,tb-ty-2,shade(co,-45)); }
  }
  // arms
  const aw=build==='big'?3:2;
  px(tx-aw,ty+1,aw,build==='big'?11:9,cd);
  px(tx+tw,ty+1,aw,build==='big'?11:9,cd);
  px(tx-aw,ty+(build==='big'?11:9),aw,2,sk);
  px(tx+tw,ty+(build==='big'?11:9),aw,2,sk);
  // belt
  if(cfg.belt!==false && build!=='robe') px(tx,ty+(tb-ty)-4,tw,2,shade(ac,-15));
  // head
  px(hx,hy,hw,hh,sk);
  px(hx+hw-1,hy,1,hh,shade(sk,-25));
  px(hx+1,hy+hh,hw-2,2,shade(sk,-15)); // neck
  const fy=hy+3;
  const face=cfg.face||'eyes';
  if(face==='eyes'){ px(hx+1,fy,1,2,bl); px(hx+hw-3,fy,1,2,bl); }
  else if(face==='goggles'){ px(hx,fy-1,hw,3,'#2a241d'); px(hx+1,fy,2,1,'#6fc0e0'); px(hx+hw-3,fy,2,1,'#6fc0e0'); }
  else if(face==='mask'){ px(hx,fy-1,hw,5,'#3a352c'); px(hx+1,fy,2,2,'#5a5248'); px(hx+hw-3,fy,2,2,'#5a5248'); px(hx+2,fy+3,3,2,'#2a241d'); }
  else if(face==='skull'){ px(hx,hy+1,hw,hh-1,'#d8d0bc'); px(hx+1,fy,2,2,bl); px(hx+hw-3,fy,2,2,bl); px(hx+2,fy+3,1,2,bl); px(hx+4,fy+3,1,2,bl); }
  else if(face==='dark'){ px(hx,hy+1,hw,hh-1,'#1a1610'); px(hx+1,fy,1,1,cfg.eyeCol||'#e8b13c'); px(hx+hw-3,fy,1,1,cfg.eyeCol||'#e8b13c'); }
  else if(face==='snout'){
    px(hx+hw-1,fy+1,3,3,shade(sk,-10)); px(hx+hw+1,fy+2,1,1,bl);
    px(hx+1,fy,1,1,'#e8d27a'); px(hx+hw-3,fy,1,1,'#e8d27a');
    px(hx+1,hy-1,1,2,shade(sk,-25)); px(hx+4,hy-1,1,2,shade(sk,-25));
  }
  else if(face==='bandana'){ px(hx,fy+1,hw,4,cfg.bandCol||'#a8382a'); px(hx+1,fy-1,1,2,bl); px(hx+hw-3,fy-1,1,2,bl); }
  // headgear
  const hat=cfg.hat||'none', hc=cfg.hatCol||shade(co,-20);
  if(hat==='brim'){ px(hx-3,hy-1,hw+6,2,hc); px(hx,hy-4,hw,3,hc); }
  else if(hat==='cap'){ px(hx,hy-3,hw,3,hc); px(hx+hw-1,hy-1,3,1,hc); }
  else if(hat==='helmet'){ px(hx-1,hy-3,hw+2,5,hc); px(hx-1,hy+2,1,3,hc); px(hx+hw,hy+2,1,3,hc); px(hx,hy-2,2,1,shade(hc,25)); }
  else if(hat==='hood'){
    px(hx-2,hy-3,hw+4,hh+3,hc); px(hx,hy+1,hw,hh-1,'#1a1610');
    px(hx-2,hy+hh,2,3,hc); px(hx+hw,hy+hh,2,3,hc);
    if(face!=='dark'){ px(hx+1,fy,1,1,'#e8d27a'); px(hx+hw-3,fy,1,1,'#e8d27a'); }
  }
  else if(hat==='cowl'){ px(hx-2,hy-2,hw+4,4,hc); px(hx-2,hy+2,2,6,hc); px(hx+hw,hy+2,2,6,hc); }
  else if(hat==='mohawk'){ for(let i=0;i<hw;i+=2) px(hx+i,hy-4+(i%3),2,5,hc); }
  else if(hat==='spikes'){
    for(let i=0;i<7;i++){ const a=-0.2+i*0.55; px(Math.round(hx+hw/2+Math.cos(a-1.6)*6), Math.round(hy+2+Math.sin(a-1.6)*6),2,2,hc); }
  }
  else if(hat==='hair'){ px(hx,hy-2,hw,3,hc); px(hx-1,hy,1,3,hc); }
  // front props
  const pr=cfg.props||[];
  if(pr.indexOf('roboarm')>=0){                        /* ...and arches up over the shoulder */
    const R='#8a6a3a', R2='#6b4f2a', J='#4a3f32', M='#b09468';
    px(tx+10,2,3,9,R); px(tx+12,2,1,9,R2);
    px(tx+9,0,5,3,J);
    px(tx+3,0,7,3,R); px(tx+3,2,7,1,R2);
    px(tx+1,0,3,2,M); px(tx+1,3,3,2,M); px(tx+3,1,2,3,J);
    px(tx+11,5,1,1,M); px(tx+11,8,1,1,M);
  }
  if(pr.indexOf('rifle')>=0){ px(tx-4,ty+6,12,1,'#3a3129'); px(tx-1,ty+7,5,2,'#5a4330'); px(tx+7,ty+5,2,2,'#6b6258'); }
  if(pr.indexOf('pistol')>=0){ px(tx+tw,ty+7,4,2,'#3a3129'); px(tx+tw+1,ty+9,2,2,'#5a4330'); }
  if(pr.indexOf('cane')>=0){ px(tx+tw+2,ty+4,1,16,'#5a3f28'); px(tx+tw+1,ty+3,3,1,'#7a5738'); }
  if(pr.indexOf('staff')>=0){
    px(tx+tw+2,ty-6,1,26,'#4a3526');
    px(tx+tw,ty-9,5,1,'#e8b13c'); px(tx+tw+2,ty-11,1,3,'#e8b13c');
    px(tx+tw-1,ty-8,1,1,'#e8b13c'); px(tx+tw+5,ty-8,1,1,'#e8b13c');
  }
  if(pr.indexOf('wrench')>=0){ px(tx-4,ty+5,2,7,'#8a8178'); px(tx-5,ty+4,4,2,'#8a8178'); }
  if(pr.indexOf('toolbox')>=0){ px(tx-5,ty+9,6,5,'#a8562a'); px(tx-4,ty+8,4,1,'#6b6258'); }
  if(pr.indexOf('case')>=0){ px(tx+tw,ty+9,5,5,'#6b4a2a'); px(tx+tw+1,ty+8,3,1,'#3a3129'); }
  if(pr.indexOf('cross')>=0){ px(tx+2,ty+3,3,1,'#c8503a'); px(tx+3,ty+2,1,3,'#c8503a'); }
  if(pr.indexOf('ammo')>=0){ for(let i=0;i<4;i++) px(tx+1+i*2,ty+3+i,2,2,'#c99a35'); }
  if(pr.indexOf('glow')>=0){
    const gl='#c8e83a';
    px(hx-4,hy-2,2,2,gl); px(hx+hw+2,hy-1,2,2,gl); px(hx-3,hy+5,2,2,gl);
    px(hx+hw+3,hy+6,2,2,gl); px(hx+1,hy-5,2,2,gl);
  }
  if(pr.indexOf('tentacle')>=0){
    px(tx+tw-1,ty-2,2,3,shade(sk,-10)); px(tx+1,ty-2,2,3,shade(sk,-10));
    px(tx+tw+1,ty-4,2,2,shade(sk,-20));
  }
  return cvs;
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, gg=((n>>8)&255)+amt, b=(n&255)+amt;
  r=clamp(r,0,255); gg=clamp(gg,0,255); b=clamp(b,0,255);
  return '#'+((1<<24)+(r<<16)+(gg<<8)+b).toString(16).slice(1);
}

  return { sign:1+0.15*S.up.sign, haggleRate:0.55*(1+0.5*S.up.tongue),
           haggleMax:0.50+0.25*S.up.tongue };
}

/* ---------------- effects ---------------- */
function burst(x,y,col,n,spd){
  for(let i=0;i<(n||10);i++){
    const a=Math.random()*Math.PI*2, s=rnd(40,spd||150);
    S.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:rnd(0.4,0.9),max:0.9,col:col,sz:rnd(3,6),gr:340});
  }
}
function dust(x,y,n){
  for(let i=0;i<(n||6);i++)
    S.parts.push({x:x+rnd(-10,10),y:y,vx:rnd(-25,25),vy:rnd(-40,-10),life:rnd(0.5,1.1),max:1.1,col:'#6b5c48',sz:rnd(3,6),gr:60});
}
function float(x,y,text,col,size){ S.floats.push({x:x,y:y,t:0,dur:1.1,text:text,col:col||C.gold,sz:size||20}); }
function shake(a){ S.shake=Math.max(S.shake,a); }
function flash(col,a){ S.flash=Math.max(S.flash,a||0.3); S.flashCol=col||'#fff'; }
function flyer(item,x,y,tx,ty,dur,arc,done){
  S.flyers.push({item:item,x0:x,y0:y,x:x,y:y,tx:tx,ty:ty,t:0,dur:dur||0.45,arc:arc||60,done:done});
}
function say(line){ S.traderLine=line; S.traderLineT=3.2; }

/* ---------------- shelves ---------------- */
function makeShelves(){
  const cats=activeCats(), old=S.shelves;
  S.shelves=[];
  for(let i=0;i<S.rows;i++)
    S.shelves.push({cat: old[i]? old[i].cat : cats[i%cats.length], slots: (S.wb&&old[i])? old[i].slots : [null,null,null,null]});   /* with a workbench, stock keeps overnight */
  S.shelves.forEach((sh,i)=>{ if(cats.indexOf(sh.cat)<0) sh.cat=cats[i%cats.length]; });
  cats.forEach(c=>{
    if(!S.shelves.some(sh=>sh.cat===c)){
      const dupe=S.shelves.find(sh=>S.shelves.filter(o=>o.cat===sh.cat).length>1);
      if(dupe) dupe.cat=c;
    }
  });
}
function freeCounterSlot(){ for(let i=0;i<S.cslots;i++) if(!S.counter[i]) return i; return -1; }
function counterCount(){ let n=0; for(let i=0;i<S.cslots;i++) if(S.counter[i]) n++; return n; }
function freeShelfSlot(cat){
  for(let i=0;i<S.shelves.length;i++){
    if(S.shelves[i].cat!==cat) continue;
    for(let j=0;j<4;j++) if(!S.shelves[i].slots[j]) return {i:i,j:j};
  }
  return null;
}
function anyShelfItem(){
  const all=[];
  S.shelves.forEach((sh,i)=>sh.slots.forEach((s,j)=>{ if(s&&!s.arriving) all.push({i:i,j:j,e:s}); }));
  return all.length? pick(all):null;
}
function stockCount(){ let n=0; S.shelves.forEach(sh=>sh.slots.forEach(s=>{ if(s) n++; })); return n; }

/* ---------------- spawning ---------------- */
function rollItem(){ return pick(BYCAT[pick(activeCats())]); }
function spawnCrate(){
  const n=crateSize(S.day), items=[];
  for(let i=0;i<n;i++) items.push(rollItem());
  const cb=counterBlock();
  S.crates.push({x:-150,y:cb.y-4,t:0,items:items,state:'in'});
  Snd.horn(); say(pick(['Caravan\'s in.','More junk. Sort it.','Fresh off the road.']));
}
function deliverItem(it,fx,fy){
  const idx=freeCounterSlot();
  if(idx>=0){
    S.counter[idx]={item:it,arriving:1,anim:0,misfiled:false};
    const r=counterSlotRect(idx);
    flyer(it,fx,fy,r.x+r.w/2,r.y+r.h/2,0.42,80,()=>{
      if(S.counter[idx]){ S.counter[idx].arriving=0; S.counter[idx].anim=1; }
      dust(r.x+r.w/2,r.y+r.h-6,4); Snd.drop();
    });
  } else {
    const cb=counterBlock(), tx=rnd(cb.x+40,cb.x+cb.w-40);
    flyer(it,fx,fy,tx,H+60,0.7,-40,()=>{});
    S.spilled++; S.combo=0;
    float(tx,cb.y+30+rnd(-16,16),'SPILLED',C.red,18); shake(6); Snd.bad();
  }
}
function spawnCustomer(){
  let freeRow;
  for(let i=0;i<queueRows();i++) if(!S.custs.some(c=>c.row===i)){ freeRow=i; break; }
  if(freeRow===undefined) return;
  const pool=TYPES.filter(t=>t.tier<=tierFor(S.day));
  const t=pick(pool);
  const cats=activeCats().filter(c=>t.wants.indexOf(c)>=0);
  const cat=cats.length? pick(cats):pick(activeCats());
  let want, patMul=1;
  if(S.day>=BULK_DAY && Math.random()<BULK_CHANCE){
    const n=pick([2,3,3,3,4]);
    want={kind:'bundle',cat:cat,item:(Math.random()<0.3?pick(BYCAT[cat]):null),n:n};
    patMul=1.45;
  } else {
    want = Math.random()<0.35 ? {kind:'item',item:pick(BYCAT[cat]),cat:cat} : {kind:'cat',cat:cat};
  }
  const pm=patScale(S.day)*patMul;
  S.custs.push({type:t,row:freeRow,want:want,pat:t.pat*pm,patMax:t.pat*pm,
    x:W+60,y:custRect(freeRow).y,state:'walk',st:0,bob:Math.random()*6,mood:0,
    line:pick(t.hello),lineT:2.8,shakeT:0});
}

/* ---------------- economy ---------------- */
function comboMult(){ return 1+0.05*Math.min(S.combo,10); }
function addCombo(){
  S.combo++; S.maxCombo=Math.max(S.maxCombo,S.combo); S.dayCombo=Math.max(S.dayCombo,S.combo);
  if(S.combo===5||S.combo===10||S.combo===15){ flash(C.gold,0.22); Snd.good(); }
}
function breakCombo(){ S.combo=0; }
function salePrice(cust,entry,haggle){
  const src = entry.src==='shelf' ? (entry.misfiled?0.5:1.0) : 0.6;
  const wantM = (cust.want.kind==='item'||(cust.want.kind==='bundle'&&cust.want.item)) ? 1.4 : 1.0;
  const patter = S.patterT>0 ? 1.5 : 1;
  const it=entry.item, v=(it.base||it).v*RAR[Math.min(it.r||0,purseR(cust))].m;
  return Math.max(1, Math.round(0.5*patter*v*src*wantM*cust.type.pay*priceMults().sign*comboMult()
                  *(1+(haggle||0))*(1+(entry.bonus||0))));
}
function wantsMatch(cust,item){
  if(cust.want.kind==='bundle') return false;
  return cust.want.kind==='item' ? cust.want.item.id===item.id : cust.want.cat===item.cat;
}

const MATBY={}; MATS.forEach(m=>{ MATBY[m.id]=m; m.spr=spriteFrom(m.px,Object.assign({k:'#1a1410'},m.pal)); });
/* item id -> [material A, material B, workbench-day the recipe opens, how many one craft yields]
   Goods sell at about half their value, so the cheap ones come out in pairs or they would never pay. */
const RECIPES={
  pipegun:['scrap','timber',1,1], bandage:['cloth','herbs',1,2], beans:['grain','glass',1,2], board:['wire','cloth',1,2],
  cans:['grain','scrap',2,2],     shells:['scrap','chem',2,2],
  stimpak:['glass','chem',3,1],   water:['glass','cloth',3,1],
  cell:['wire','scrap',4,1],      tape:['cloth','cloth',4,2],
  knife:['scrap','cloth',5,1],    mutfruit:['grain','grain',5,2],
  radaway:['herbs','glass',6,1],  terminal:['wire','glass',6,1], scrap:['scrap','scrap',6,2]
};
ITEMS.forEach(it=>{ it.r=0; it.base=it; });
const VARIANT={};
function rar(item,r){
  const b=item.base||item; if(!r) return b;
  const k=b.id+r;
  if(!VARIANT[k]) VARIANT[k]=Object.assign({},b,{r:r,base:b,v:Math.round(b.v*RAR[r].m)});
  return VARIANT[k];
}
/* demo: the workshop is this morning. main game: it is tonight, stocking for tomorrow, and the
   recipe / tier calendar counts from the day the bench was bought. */
function effDay(){ return CRAFT.demo ? S.day : S.day+1; }
function craftDay(){ return CRAFT.demo ? S.day : Math.max(1,effDay()-S.wbDay+1); }
function recipeOpen(it){ return craftDay()>=RECIPES[it.id][2]; }
function openItems(cat){ return BYCAT[cat].filter(recipeOpen); }
function purseR(c){ return clamp(c.type.tier,1,3); }            /* richest tier this customer pays full price for */
function billOf(list){ const o={}; list.forEach(p=>{ if(p[1]>0) o[p[0]]=(o[p[0]]||0)+p[1]; }); return o; }
function recipeBill(it){ const rc=RECIPES[it.id]; return billOf([[rc[0],1],[rc[1],1]]); }
function upgradeBill(item){
  const r=(item.r||0)+1, rc=RECIPES[item.base.id];
  return billOf([[rc[0],[0,2,3,4][r]],[rc[1],[0,1,3,4][r]],['fine',[0,0,1,2][r]],['relic',r===3?1:0]]);
}
function billCost(b){ let s=0; for(const k in b) s+=MATBY[k].c*b[k]; return s; }
function billMissing(b){ for(const k in b) if((S.mats[k]||0)<b[k]) return MATBY[k]; return null; }
function payBill(b){ for(const k in b) S.mats[k]-=b[k]; }
function billText(b){ return Object.keys(b).map(k=>(b[k]>1?b[k]+' ':'')+MATBY[k].n).join(' + '); }
function craftReset(){
  S.mats={}; MATS.forEach(m=>S.mats[m.id]=0);
  S.tray=new Array(17).fill(null); S.back=[]; S.backT=0; S.anvil=null; S.wd=null; S.wsTab='guns';
  S.wb=CRAFT.demo; S.wbDay=1; WT.on=false; WT.done=false;
  S.cr={spent:0,daySpent:0,crafted:0,up:[0,0,0,0],soldR:[0,0,0,0],capped:0,wsTime:0,scrapped:0};
}
function buyMat(m,n){
  if(m.day&&craftDay()<m.day) return;
  const cost=m.c*n;
  if(S.caps<cost){ Snd.bad(); return; }
  S.caps-=cost; S.mats[m.id]+=n; S.cr.spent+=cost; S.cr.daySpent+=cost; Snd.coin(1);
}
function trayFree(){ let n=0; S.tray.forEach(x=>{ if(!x) n++; }); return n; }
function craft(it){
  const b=recipeBill(it), n=RECIPES[it.id][3];
  if(!recipeOpen(it)||billMissing(b)||trayFree()<n){ Snd.bad(); return false; }
  payBill(b);
  for(let k=0;k<n;k++){ const free=S.tray.indexOf(null); S.tray[free]=it; S.cr.crafted++; S.cr.up[0]++;
    const q=trayRect(free); burst(q.x+q.w/2,q.y+q.h/2,CATS[it.cat].col,8,120); }
  Snd.good();
  return true;
}
/* scrapping hands back half of every material that went into the object (its share of a paired craft) */
function spentOn(item){
  const b=item.base||item, rc=RECIPES[b.id], o={};
  o[rc[0]]=(o[rc[0]]||0)+1/rc[3]; o[rc[1]]=(o[rc[1]]||0)+1/rc[3];
  let cur=b; for(let u=0;u<(item.r||0);u++){ const ub=upgradeBill(cur); for(const k in ub) o[k]=(o[k]||0)+ub[k]; cur=rar(cur,u+1); }
  return o;
}
function scrapYield(item){
  const sp=spentOn(item), o={}; let any=false;
  for(const k in sp){ const n=Math.floor(sp[k]/2); if(n>0){ o[k]=n; any=true; } }
  if(!any) o[RECIPES[(item.base||item).id][0]]=1;
  return o;
}
function scrapItem(item){
  const y=scrapYield(item); for(const k in y) S.mats[k]+=y[k];
  S.cr.scrapped++;
  const q=binRect(); dust(q.x+q.w/2,q.y+q.h/2,8); float(q.x+q.w/2,q.y-4,'+'+billText(y),C.dim,11); Snd.drop();
}
function canUpgrade(item){
  if(!item) return 'empty';
  const r=(item.r||0)+1;
  if(r>3) return 'max';
  if(craftDay()<RAR[r].day) return 'day';
  return billMissing(upgradeBill(item)) ? 'short' : 'ok';
}
function doUpgrade(){
  if(canUpgrade(S.anvil)!=='ok'){ Snd.bad(); return false; }
  payBill(upgradeBill(S.anvil));
  S.anvil=rar(S.anvil,S.anvil.r+1); S.cr.up[S.anvil.r]++;
  const a=anvilRect(); burst(a.x+a.w/2,a.y+a.h/2,RAR[S.anvil.r].col,22,240);
  float(a.x+a.w/2,a.y-6,RAR[S.anvil.r].n+'!',RAR[S.anvil.r].col,20);
  flash(RAR[S.anvil.r].col,0.18); Snd.coin(4+S.anvil.r*2);
  return true;
}

const WS={mk:{x:16,y:70,w:290,h:676}, wb:{x:318,y:70,w:440,h:676}, sh:{x:770,y:70,w:494,h:676}};
function anvilRect(){ return {x:WS.wb.x+18,y:WS.wb.y+330,w:96,h:96}; }
function trayRect(i){ return {x:WS.wb.x+16+(i%6)*69,y:WS.wb.y+512+Math.floor(i/6)*54,w:64,h:50}; }
function binRect(){ return trayRect(17); }
function wsShelfRect(i){ return {x:WS.sh.x+12,y:WS.sh.y+44+i*132,w:WS.sh.w-24,h:126}; }
function wsSlotRect(i,j){ const r=wsShelfRect(i), sw=Math.floor((r.w-18)/4); return {x:r.x+j*(sw+6),y:r.y+24,w:sw,h:r.h-24}; }
function wsStocked(){ return stockCount()>0; }
function wsStep(){
  let mats=0; for(const k in S.mats) mats+=S.mats[k];
  const goods=S.tray.some(x=>x)||!!S.anvil;
  if(wsStocked()&&!goods) return 4;
  if(goods) return 3;
  if(mats>=2) return 2;
  return 1;
}
function wsPick(x,y){
  for(let i=0;i<17;i++) if(S.tray[i]&&inRect(x,y,trayRect(i))){ S.wd={item:S.tray[i],from:{k:'tray',i:i},x:x,y:y}; S.tray[i]=null; Snd.ui(); return; }
  if(S.anvil&&inRect(x,y,anvilRect())){ S.wd={item:S.anvil,from:{k:'anvil'},x:x,y:y}; S.anvil=null; Snd.ui(); return; }
  for(let i=0;i<S.shelves.length;i++){
    const hr=wsShelfRect(i);
    if(inRect(x,y,{x:hr.x,y:hr.y,w:hr.w,h:22})&&!S.shelves[i].slots.some(s=>s)){
      const cats=activeCats(); S.shelves[i].cat=cats[(cats.indexOf(S.shelves[i].cat)+1)%cats.length]; Snd.ui(); return;
    }
    for(let j=0;j<4;j++){ const e=S.shelves[i].slots[j];
      if(e&&inRect(x,y,wsSlotRect(i,j))){ S.wd={item:e.item,from:{k:'shelf',i:i,j:j},x:x,y:y}; S.shelves[i].slots[j]=null; Snd.ui(); return; } }
  }
}
function wsPut(to,item){
  if(to.k==='tray') S.tray[to.i]=item;
  else if(to.k==='anvil') S.anvil=item;
  else { const sh=S.shelves[to.i]; sh.slots[to.j]={item:item,misfiled:sh.cat!==item.cat,arriving:0,anim:1}; }
}
function wsDrop(x,y){
  const d=S.wd; if(!d) return; S.wd=null;
  let to=null;
  if(inRect(x,y,anvilRect())&&!S.anvil) to={k:'anvil'};
  if(inRect(x,y,binRect())){ scrapItem(d.item); return; }
  for(let i=0;i<17&&!to;i++) if(!S.tray[i]&&inRect(x,y,trayRect(i))) to={k:'tray',i:i};
  for(let i=0;i<S.shelves.length&&!to;i++) for(let j=0;j<4&&!to;j++)
    if(!S.shelves[i].slots[j]&&inRect(x,y,wsSlotRect(i,j))) to={k:'shelf',i:i,j:j};
  if(!to){ wsPut(d.from,d.item); Snd.drop(); return; }
  wsPut(to,d.item);
  if(to.k==='shelf'){
    const q=wsSlotRect(to.i,to.j), mis=S.shelves[to.i].cat!==d.item.cat;
    float(q.x+q.w/2,q.y+8,mis?'WRONG SHELF x0.5':'STOCKED',mis?C.red:C.green,13); mis?Snd.bad():Snd.good();
  } else Snd.drop();
}
function rarFrame(q,item,inset){
  if(!item||!item.r) return;
  const c=RAR[item.r].col, k=inset||2;
  g.fillStyle=rgba(c,0.16); g.fillRect(q.x+k,q.y+k,q.w-k*2,q.h-k*2);
  g.fillStyle=c;
  g.fillRect(q.x+k,q.y+k,q.w-k*2,2); g.fillRect(q.x+k,q.y+q.h-k-2,q.w-k*2,2);
  g.fillRect(q.x+k,q.y+k,2,q.h-k*2); g.fillRect(q.x+q.w-k-2,q.y+k,2,q.h-k*2);
  for(let p=0;p<item.r;p++) g.fillRect(q.x+k+5+p*7,q.y+k+5,5,5);
}
function wsCell(q,hot){
  g.fillStyle='#191310'; g.fillRect(q.x,q.y,q.w,q.h);
  g.fillStyle=hot?C.gold:'#33291f';
  g.fillRect(q.x,q.y,q.w,2); g.fillRect(q.x,q.y+q.h-2,q.w,2); g.fillRect(q.x,q.y,2,q.h); g.fillRect(q.x+q.w-2,q.y,2,q.h);

function wsGlow(p){
  const a=0.45+Math.sin(S.t*5)*0.3; g.globalAlpha=a; g.fillStyle=C.gold;
  g.fillRect(p.x-3,p.y-3,p.w+6,3); g.fillRect(p.x-3,p.y+p.h,p.w+6,3);

/* ================================================================
   WALKTHROUGHS  -  day 1 teaches the stall, day 3 teaches bulk orders
   ================================================================ */
const TUT={active:null, step:0, t:0, cust:null, row:1, sold0:0, hag:0, gave:[], done:{}};
function tutFrozen(){ return !!TUT.active; }
function lessonCust(want,typeId,line){
  const t=TYPES.find(x=>x.id===typeId)||TYPES[0];
  const pm=patScale(S.day)*(want.kind==='bundle'?1.45:1);
  const c={type:t,row:0,want:want,pat:t.pat*pm,patMax:t.pat*pm,
    x:W+60,y:custRect(0).y,state:'walk',st:0,bob:0,mood:0,line:line,lineT:9,shakeT:0};
  S.custs.push(c); return c;
}
function startLesson(id){
  TUT.active=id; TUT.step=0; TUT.t=0; TUT.cust=null; TUT.hag=0; TUT.gave=[];
  const cat='meds';
  let row=S.shelves.findIndex(sh=>sh.cat===cat);
  if(row<0){ row=Math.min(1,S.shelves.length-1); S.shelves[row].cat=cat; }
  TUT.row=row;
  S.counter=new Array(8).fill(null);
  S.custs=[];
  if(id==='basics'){
    S.shelves.forEach(sh=>sh.slots=[null,null,null,null]);
    S.counter[0]={item:pick(BYCAT[cat]),arriving:0,anim:0,misfiled:false};
    const p0=pick(BYCAT[cat]);
    S.shelves[row].slots[0]={item:p0,misfiled:false,arriving:0,anim:0};
    TUT.gave.push({i:row,j:0,item:p0});
  } else {
    S.shelves[row].slots=[0,1,2,3].map((z,j)=>{
      const it=pick(BYCAT[cat]);
      TUT.gave.push({i:row,j:j,item:it});
      return {item:it,misfiled:false,arriving:0,anim:0};
    });
    TUT.cust=lessonCust({kind:'bundle',cat:cat,item:null,n:3},'medic','I need three. For the clinic.');
  }
}
function lessonAlive(c){ return c && S.custs.indexOf(c)>=0 && (c.state==='walk'||c.state==='wait'); }
function lessonStock(cat,n){
  const row=TUT.row, sh=S.shelves[row];
  if(!sh) return;
  let have=sh.slots.filter(Boolean).length;
  while(have<n){
    const j=sh.slots.findIndex(x=>!x);
    if(j<0) break;
    const it=pick(BYCAT[cat]);
    sh.slots[j]={item:it,misfiled:false,arriving:0,anim:1};
    TUT.gave.push({i:row,j:j,item:it});      /* props, to be cleared away after */
    have++;
  }
}
/* if the buyer is gone - walked off, sold to early, anything - put another one there */
function lessonEnsure(want,typeId,line,stock){
  lessonStock(want.cat,stock||1);
  if(!lessonAlive(TUT.cust)) TUT.cust=lessonCust(want,typeId,line);
}
function lessonFinish(){
  const id=TUT.active;
  if(id) TUT.done[id]=true;
  /* take back whatever the lesson put out and the player did not use */
  TUT.gave.forEach(g=>{
    const sh=S.shelves[g.i], sl=sh&&sh.slots[g.j];
    if(sl&&sl.item===g.item){
      const r=shelfSlotRect(g.i,g.j);
      sh.slots[g.j]=null;
      dust(r.x+r.w/2,r.y+r.h/2,4);
    }
  });
  TUT.gave=[];
  TUT.active=null; TUT.cust=null;
  say(id==='bulk'?'Right. Back to it.':'Good. Now keep the counter clear.');
}
function lessonWaiting(){
  if(!TUT.active||TUT.t<0.5) return false;
  if(TUT.active==='basics') return TUT.step===0||TUT.step===4;
  return TUT.step===0 ? !!(TUT.cust&&TUT.cust.state==='wait') : TUT.step===3;
}
function lessonClick(){
  if(!lessonWaiting()) return false;
  if(TUT.step===0){ TUT.step=1; TUT.t=0; Snd.ui(); }
  else lessonFinish();
  return true;
}
function lessonStep(){
  if(!TUT.active) return;
  if(TUT.active==='basics'){
    if(TUT.step===0) return;                    /* waits for a click */
    if(TUT.step===1){
      /* the counter item is dealt with - wherever it went */
      if(!S.counter.some(Boolean)&&!S.drag){
        TUT.step=2; TUT.t=0; TUT.sold0=S.sold;
        lessonEnsure({kind:'cat',cat:'meds'},'wastelander','Anything for a cough?',1);
      }
      return;
    }
    if(TUT.step===2){
      if(S.sold>TUT.sold0){
        TUT.step=3; TUT.t=0; TUT.sold0=S.sold; TUT.hag=0;
        lessonEnsure({kind:'cat',cat:'meds'},'scavenger','Same again. Quick.',1);
      } else lessonEnsure({kind:'cat',cat:'meds'},'wastelander','Anything for a cough?',1);
      return;
    }
    if(TUT.step===3){
      if(S.sold>TUT.sold0){ TUT.step=4; TUT.t=0; }
      else lessonEnsure({kind:'cat',cat:'meds'},'scavenger','Same again. Quick.',1);
      return;
    }
    return;                                      /* step 4 waits for a click */
  }
  if(TUT.step<3) lessonEnsure({kind:'bundle',cat:'meds',item:null,n:3},'medic','I need three. For the clinic.',3);
  const c=TUT.cust; if(!c) return;
  if(TUT.step===0) return;                       /* waits for a click */
  if(TUT.step===1){ if(bundleProgress(c)>=c.want.n){ TUT.step=2; TUT.t=0; } return; }
  if(TUT.step===2){ if(S.bulkSold>0){ TUT.step=3; TUT.t=0; } return; }
  /* step 3 waits for a click */
}
function tutGlow(r){
  const a=0.30+0.5*(0.5+Math.sin(S.t*6)*0.5);
  g.globalAlpha=a; g.fillStyle=C.gold;
  g.fillRect(r.x-3,r.y-3,r.w+6,3); g.fillRect(r.x-3,r.y+r.h,r.w+6,3);
  g.fillRect(r.x-3,r.y,3,r.h); g.fillRect(r.x+r.w,r.y,3,r.h);
  g.globalAlpha=1;
}
function drawLesson(){
  if(!TUT.active) return;
  const step=TUT.step, basics=TUT.active==='basics';
  let head='', body='';
  if(basics){
    if(step===0){ head='THE CARAVAN LEFT YOU SOMETHING';
      body='That is the counter. Everything lands there unsorted, and it does not pay well there.'; }
    else if(step===1){ head='DRAG IT ONTO THE MEDS SHELF';
      body='Each shelf takes one kind. Stock on the right shelf sells for full price; off the counter it sells for 60%.'; }
    else if(step===2){ head='NOW SELL IT';
      body='He wants MEDS. Drag a mend shot or a wrap from the shelf onto his card.'; }
    else if(step===3){ head='HOLD IT OVER HIM TO HAGGLE';
      body='Do not let go straight away. The price climbs while you hold - and his patience burns three times faster.'; }
    else { head='THAT IS THE JOB';
      body='Sort the counter, serve the window, squeeze the price. Rent is due at dusk.'; }
  } else {
    if(step===0){ head='A BULK ORDER';
      body='This one does not want one thing. His card says 3 x MEDS.'; }
    else if(step===1){ head='HOLD SHIFT AND CLICK THREE MEDS';
      body='Shift-click marks an item instead of picking it up. Watch the counter on his card fill.'; }
    else if(step===2){ head='NOW DRAG ONE OF THEM ONTO HIM';
      body='Let go of shift. Drag any marked item to the buyer and the whole stack goes at once.'; }
    else { head='THAT IS A BULK SALE';
      body='Three items, one queue slot, x'+bundleMult(3).toFixed(2)+' on the lot.'; }
  }
  const w=560, x=LO.panelL.x+LO.panelL.w/2-w/2, y=LO.panelL.y-94;
  plate(x,y,w,80,'#1d1712',C.gold,'#8a6f50');
  txt(head,x+w/2,y+24,18,C.gold,'center');
  wrapText(body,x+22,y+48,w-44,16,12,C.ink);
  const last = basics? step>=4 : step>=3;
  if(lessonWaiting())
    txt(Math.sin(S.t*4)>0?'click anywhere to carry on':' ',x+w/2,y+68,11,C.gold,'center','normal');
  if(!last){
    const bw=76;
    plate(x+w-bw-6,y+54,bw,20,'#241c16','#5c4a37');
    txt('SKIP',x+w-bw/2-6,y+64,11,C.dim,'center');
    BTNS.push({x:x+w-bw-6,y:y+54,w:bw,h:20,fn:()=>lessonFinish()});
  }
  const c=TUT.cust, cr=c?custRect(c.row):null;
  if(basics){
    if(step===0||step===1){
      const q=counterSlotRect(0); if(S.counter[0]) tutGlow({x:q.x,y:q.y,w:q.w,h:q.h});
      if(step===1){ const rr=shelfRect(TUT.row); tutGlow({x:rr.x,y:rr.y,w:rr.w,h:rr.h}); }
    } else if(step===2||step===3){
      S.shelves[TUT.row].slots.forEach((sl,j)=>{
        if(sl&&!sl.arriving){ const q=shelfSlotRect(TUT.row,j); tutGlow({x:q.x,y:q.y,w:q.w,h:q.h-6}); }
      });
      if(c&&c.state==='wait') tutGlow({x:c.x,y:c.y,w:cr.w,h:cr.h});
    }
  } else {
    if((step===0||step===2)&&c&&c.state==='wait') tutGlow({x:c.x,y:c.y,w:cr.w,h:cr.h});
    else if(step===1&&c){
      S.shelves.forEach((sh,i)=>sh.slots.forEach((sl,j)=>{
        if(sl&&!sl.arriving&&sl.item.cat===c.want.cat&&selIndex('shelf',i,j)<0){
          const q=shelfSlotRect(i,j); tutGlow({x:q.x,y:q.y,w:q.w,h:q.h-6});
        }
      }));
    }
  }
}

/* ================================================================
   DAY FLOW
   ================================================================ */
function startRun(){
  S.day=1; S.caps=40; S.maxCombo=0; S.rows=4; S.cslots=5; S.history=[]; S.hire={lvl:0,on:true};
  S.actOwn=[false,false,false,false]; S.actCd=[0,0,0,0]; S.steadyT=0; S.patterT=0;
  TUT.done={};
  craftReset();
  UPGRADES.forEach(u=>S.up[u.id]=0);
  S.shelves=[]; makeShelves(); startDay();
}
function startDay(){
  S.counter=new Array(8).fill(null);
  S.custs=[]; S.flyers=[]; S.crates=[]; S.drag=null;
  makeShelves();
  S.dayTime=0; S.dayLen=dayLenFor(S.day); S.earned=0; S.sold=0; S.angry=0; S.spilled=0;
  S.combo=0; S.closing=false; S.overtime=0;
  S.catEarn={}; S.dayCombo=0; S.bulkSold=0; selClear();
  S.actCd=[0,0,0,0]; S.steadyT=0; S.patterT=0;
  S.nextCrate=1.4; S.nextCust=S.day===1?5.0:2.6; S.droneT=9;
  S.rushDone=false; S.rushQueue=0; S.rushT=0; S.banner=null;
  botReset();
  S.scene='dayintro'; S.sceneT=0; S.tut=S.day===1?1:0;
  TUT.active=null; TUT.cust=null;
  if(S.day===1&&!TUT.done.basics) startLesson('basics');
  else if(S.day===BULK_DAY&&!TUT.done.bulk) startLesson('bulk');
  S.traderLine=null; S.traderLineT=0;
}
function endDay(){
  const rent=rentFor(S.day), wage=handWage();
  S.endReport={earned:S.earned,rent:rent,wage:wage,handTake:BOT.earned,sold:S.sold,bulk:S.bulkSold,angry:S.angry,
               spilled:S.spilled,combo:S.dayCombo,before:S.caps,after:S.caps-rent-wage,mats:S.cr.daySpent};
  S.cr.daySpent=0;
  S.history.push({day:S.day,earned:S.earned,rent:rent,sold:S.sold,angry:S.angry,
                  spilled:S.spilled,combo:S.dayCombo,cat:Object.assign({},S.catEarn)});
  S.caps-=rent+wage;
  if(S.day>S.best.day){ S.best.day=S.day; saveBest(); }
  if(S.caps>S.best.caps){ S.best.caps=S.caps; saveBest(); }
  S.scene='report'; S.sceneT=0;
  S.deadReason = S.caps<0 ? 'You could not make rent. The council took the stall.' : null;
}
function nextDay(){ S.day++; startDay(); }
function shutUpShop(){
  S.closing=true;
  S.custs.forEach(c=>{ if(c.state==='wait'||c.state==='walk'){ c.state='leave'; c.mood=0; c.line='Closing? Fine.'; c.lineT=1.2; } });
  S.crates.length=0;
}
function canBuy(u){ const lv=S.up[u.id]; return lv<u.max && S.caps>=u.cost[lv]; }
function buyUpgrade(u){
  if(!canBuy(u)){ Snd.bad(); return; }
  S.caps-=u.cost[S.up[u.id]]; S.up[u.id]++;
  if(u.id==='slot') S.cslots++;
  if(u.id==='drone') TRADER_KEY='';
  Snd.coin(3); flash(C.gold,0.16);
}

/* ================================================================
   UPDATE
   ================================================================ */
function tick(dt){
  dt=Math.min(dt,0.05);
  S.t+=dt; S.sceneT+=dt;
  S.shake=Math.max(0,S.shake-dt*28);
  for(let i=0;i<4;i++) if(S.actCd[i]>0) S.actCd[i]=Math.max(0,S.actCd[i]-dt);
  S.steadyT=Math.max(0,S.steadyT-dt);
  S.patterT=Math.max(0,S.patterT-dt);
  S.flash=Math.max(0,S.flash-dt*2.2);
  S.traderLineT=Math.max(0,S.traderLineT-dt);

  for(let i=S.parts.length-1;i>=0;i--){
    const p=S.parts[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.gr*dt;
    if(p.life<=0) S.parts.splice(i,1);
  }
  for(let i=S.floats.length-1;i>=0;i--){
    const f=S.floats[i]; f.t+=dt; f.y-=34*dt;
    if(f.t>=f.dur) S.floats.splice(i,1);
  }
  for(let i=S.flyers.length-1;i>=0;i--){
    const f=S.flyers[i]; f.t+=dt;
    const k=clamp(f.t/f.dur,0,1), e=1-Math.pow(1-k,2.2);
    f.x=lerp(f.x0,f.tx,e); f.y=lerp(f.y0,f.ty,e)-Math.sin(k*Math.PI)*f.arc;
    if(k>=1){ if(f.done) f.done(); S.flyers.splice(i,1); }
  }
  if(S.scene==='workshop'){ S.cr.wsTime+=dt; workTutTick(dt); }
  if(S.scene!=='play'||S.paused) return;

  if(tutFrozen()){ TUT.t+=dt; lessonStep(); }
  if(!tutFrozen()) S.dayTime+=dt;
  if(S.dayTime>=S.dayLen && !S.closing){ S.closing=true; say('Shutters in a minute.'); }

  if(!S.closing&&!tutFrozen()){
    S.nextCrate-=dt;
    if(S.nextCrate<=0){ S.nextCrate=crateEvery(S.day); spawnCrate(); }
    S.nextCust-=dt;
    if(S.nextCust<=0){ S.nextCust=custEvery(S.day)*rnd(0.8,1.2); spawnCustomer(); }
  } else if(S.closing) S.overtime+=dt;   /* a frozen lesson is not overtime */

  if(!S.rushDone && S.dayTime>S.dayLen*0.5 && !S.closing && !tutFrozen()){
    S.rushDone=true; S.rushQueue=2; S.rushT=0.4;
    spawnCrate(); spawnCrate();
    S.banner={text:'CARAVAN ROLLS IN',sub:'two crates and a crowd',t:0,dur:3.2};
    flash(C.gold,0.2); shake(6);
  }
  if(S.rushQueue>0){ S.rushT-=dt; if(S.rushT<=0){ S.rushT=1.1; S.rushQueue--; spawnCustomer(); } }
  if(S.banner){ S.banner.t+=dt; if(S.banner.t>S.banner.dur) S.banner=null; }

  for(let i=S.crates.length-1;i>=0;i--){
    const cr=S.crates[i]; cr.t+=dt;
    if(cr.state==='in'){
      cr.x=lerp(cr.x,LO.panelL.x+30,1-Math.pow(0.001,dt));
      if(cr.x>LO.panelL.x&&cr.t>0.35){ cr.state='pop'; cr.t=0; }
    } else if(cr.state==='pop'){
      if(cr.t>0.1){
        cr.t=0; const it=cr.items.shift();
        if(it){ deliverItem(it,cr.x+26,cr.y+10); dust(cr.x+26,cr.y+30,3); }
        else cr.state='out';
      }
    } else { cr.x-=260*dt; if(cr.x<-220) S.crates.splice(i,1); }
  }

  if(S.up.drone>0){
    S.droneT-=dt*S.up.drone;
    if(S.droneT<=0){
      S.droneT=9;
      for(let i=0;i<S.cslots;i++){
        const e=S.counter[i];
        if(e&&!e.arriving){
          const f=freeShelfSlot(e.item.cat);
          if(f){
            const from=counterSlotRect(i), to=shelfSlotRect(f.i,f.j);
            S.counter[i]=null;
            S.shelves[f.i].slots[f.j]={item:e.item,misfiled:false,arriving:1,anim:0};
            flyer(e.item,from.x+from.w/2,from.y+from.h/2,to.x+to.w/2,to.y+to.h/2,0.5,70,()=>{
              const sl=S.shelves[f.i].slots[f.j]; if(sl){ sl.arriving=0; sl.anim=1; } Snd.tick();
            });
          }
          break;
        }
      }
    }
  }

  let queueBusy=false;
  for(let i=S.custs.length-1;i>=0;i--){
    const c=S.custs[i];
    c.st+=dt; c.bob+=dt; c.lineT=Math.max(0,c.lineT-dt); c.shakeT=Math.max(0,c.shakeT-dt);
    const target=custRect(c.row);
    c.y=lerp(c.y,target.y,1-Math.pow(0.0005,dt));
    if(c.state==='walk'){
      queueBusy=true;
      c.x=lerp(c.x,target.x,1-Math.pow(0.002,dt));
      if(Math.abs(c.x-target.x)<3){ c.x=target.x; c.state='wait'; c.st=0; }
    } else if(c.state==='wait'){
      queueBusy=true;
      let rate=1;
      if((S.drag&&S.drag.hagCust===c)||(BOT.drag&&BOT.drag.hagCust===c)) rate = c.type.rob?4.5:3.0;
      if(!tutFrozen()&&S.steadyT<=0) c.pat-=dt*rate;
      if(c.pat<=0){
        c.state='leave'; c.st=0; c.mood=-1; c.line=pick(c.type.bye); c.lineT=1.8;
        S.angry++; breakCombo(); Snd.angry(); shake(8);
        float(c.x+150,c.y+34,'WALKED OUT',C.red,20);
        if(c.type.rob && S.up.guard===0){
          const st=anyShelfItem();
          if(st){
            const r=shelfSlotRect(st.i,st.j);
            S.shelves[st.i].slots[st.j]=null;
            flyer(st.e.item,r.x+r.w/2,r.y+r.h/2,W+80,c.y+50,0.6,50,()=>{});
            float(r.x+r.w/2,r.y+18,'STOLEN!',C.red,18); shake(10);
          }
        }
        if(S.drag&&S.drag.hagCust===c) S.drag.hagCust=null;
      }
    } else if(c.state==='served'){
      queueBusy=true; if(c.st>0.8){ c.state='leave'; c.st=0; }
    } else {
      c.x+=(c.mood<0?380:300)*dt;
      if(c.x>W+140){ S.custs.splice(i,1); S.custs.sort((a,b)=>a.row-b.row).forEach((cc,k)=>cc.row=k); }
    }
  }
  if(S.closing&&!queueBusy&&S.crates.length===0) endDay();
  if(S.overtime>30) S.custs.forEach(c=>{ if(c.state!=='leave'){ c.state='leave'; c.mood=0; } });

  for(let i=0;i<8;i++){ const e=S.counter[i]; if(e&&e.anim>0) e.anim=Math.max(0,e.anim-dt*4); }
  S.shelves.forEach(sh=>sh.slots.forEach(s=>{ if(s&&s.anim>0) s.anim=Math.max(0,s.anim-dt*4); }));

  if(S.drag){
    S.drag.t+=dt;
    if(S.drag.hagCust){
      const pm=priceMults();
      S.drag.haggle=Math.min(pm.haggleMax,S.drag.haggle+dt*pm.haggleRate*(S.patterT>0?3:1));
      if(S.drag.haggle>=pm.haggleMax-0.001&&S.patterT<=0){
        S.drag.snap=(S.drag.snap||0)+dt;
        if(S.drag.snap>0.9){
          const c=S.drag.hagCust;
          if(!tutFrozen()) c.pat=Math.max(0.8,c.pat-c.patMax*0.35);
          c.line='Push me again and I walk.'; c.lineT=1.6; c.shakeT=0.45;
          float(c.x+260,c.y+26,'TOO GREEDY',C.red,22);
          S.drag.haggle=0; S.drag.snap=0; breakCombo(); Snd.angry(); shake(9);
        }
      } else S.drag.snap=0;
    } else S.drag.snap=0;
  }
  botTick(dt);
}

/* ================================================================
   SELLING / PLACING
   ================================================================ */
function sellTo(c,drag){
  const price=salePrice(c,{item:drag.item,src:drag.src,misfiled:drag.misfiled},drag.haggle||0);
  S.caps+=price; S.earned+=price; S.sold++;
  S.catEarn[drag.item.cat]=(S.catEarn[drag.item.cat]||0)+price;
  addCombo(); TUT.hag=drag.haggle||0;
  S.cr.soldR[drag.item.r||0]++;
  if((drag.item.r||0)>purseR(c)){ S.cr.capped++; const rr=custRect(c.row); float(rr.x+170,rr.y+104,'PURSE TOO SMALL - PAID AS '+RAR[purseR(c)].n,C.red,12); }
  c.state='served'; c.st=0; c.mood=1; c.line=null;
  const r=custRect(c.row);
  float(r.x+170,r.y+22,'+'+price+'c',C.gold,26);
  if(drag.src==='shelf'&&!drag.misfiled) float(r.x+170,r.y+48,'SHELF STOCK x1.0',C.green,13);
  if(drag.src==='counter') float(r.x+170,r.y+48,'OFF THE CRATE x0.6',C.dim,13);
  if(drag.misfiled) float(r.x+170,r.y+48,'MISFILED x0.5',C.red,13);
  if(drag.haggle>0.05) float(r.x+170,r.y+68,'HAGGLED +'+Math.round(drag.haggle*100)+'%',C.purple,13);
  if(c.want.kind==='item') float(r.x+170,r.y+86,'EXACT MATCH x1.4',C.blue,13);
  burst(r.x+170,r.y+40,C.gold,16,220);
  Snd.coin(S.combo); flash(C.gold,0.12);
  if(S.tut===2) S.tut=3;
}
function sellBundle(c,d){
  const list=d.bundle;
  let sum=0;
  list.forEach(b=> sum+=salePrice(c,{item:b.item,src:b.src,misfiled:b.misfiled},d.haggle||0));
  const mult=bundleMult(list.length), price=Math.round(sum*mult);
  S.caps+=price; S.earned+=price; S.sold++; S.bulkSold++;
  const share=Math.round(price/list.length);
  list.forEach(b=>{ S.catEarn[b.item.cat]=(S.catEarn[b.item.cat]||0)+share; addCombo(); });
  c.mood=1; c.state='served'; c.st=0; c.line=null;
  const r=custRect(c.row);
  float(r.x+170,r.y+16,'+'+price+'c',C.gold,30);
  float(r.x+170,r.y+46,'BULK ORDER OF '+list.length+'  ·  x'+mult.toFixed(2),'#e8b13c',15);
  if(d.haggle>0.05) float(r.x+170,r.y+68,'HAGGLED +'+Math.round(d.haggle*100)+'%',C.purple,13);
  list.forEach((b,i)=> flyer(b.item,d.x+rnd(-14,14),d.y+rnd(-10,10),r.x+150+i*16,r.y+40,0.42+i*0.06,70,()=>{}));
  burst(r.x+170,r.y+40,C.gold,26,280);
  Snd.coin(8); flash(C.gold,0.2); shake(4);
}
function placeOnShelf(si,sj,drag){
  const sh=S.shelves[si], mis=sh.cat!==drag.item.cat;
  sh.slots[sj]={item:drag.item,misfiled:mis,arriving:0,anim:1};
  const r=shelfSlotRect(si,sj);
  if(mis){
    breakCombo();
    float(r.x+r.w/2,r.y+8,'WRONG SHELF',C.red,15); Snd.bad(); shake(5);
  } else {
    addCombo();
    float(r.x+r.w/2,r.y+8,'FILED',C.green,15);
    burst(r.x+r.w/2,r.y+r.h/2,CATS[sh.cat].col,8,130); Snd.good();
  }
  dust(r.x+r.w/2,r.y+r.h-6,4);
  if(S.tut===1) S.tut=2;
}
function returnDrag(){
  const d=S.drag; if(!d) return;
  if(d.src==='counter'&&d.si>=0&&!S.counter[d.si]) S.counter[d.si]={item:d.item,arriving:0,anim:0.6,misfiled:false};
  else if(d.src==='shelf'&&S.shelves[d.si]&&!S.shelves[d.si].slots[d.sj])
    S.shelves[d.si].slots[d.sj]={item:d.item,misfiled:d.misfiled,arriving:0,anim:0.6};
  else { const f=freeCounterSlot(); if(f>=0) S.counter[f]={item:d.item,arriving:0,anim:0.6,misfiled:false}; }
}

/* ================================================================
   INPUT
   ================================================================ */
let BTNS=[], MX=0, MY=0;
function toDesign(ev){
  const r=cv.getBoundingClientRect();
  return {x:(ev.clientX-r.left-VX)/VS, y:(ev.clientY-r.top-VY)/VS};
}
function custUnder(x,y){
  for(const c of S.custs){
    if(c.state!=='wait') continue;
    const r=custRect(c.row);
    if(x>=c.x&&x<=c.x+r.w&&y>=c.y&&y<=c.y+r.h) return c;
  }
  return null;
}
function shelfSlotUnder(x,y){
  for(let i=0;i<S.shelves.length;i++) for(let j=0;j<4;j++)
    if(inRect(x,y,shelfSlotRect(i,j))) return {i:i,j:j};
  return null;
}
function shelfRowUnder(x,y){
  for(let i=0;i<S.shelves.length;i++) if(inRect(x,y,shelfRect(i))) return i;
  return -1;
}
function counterSlotUnder(x,y){
  for(let j=0;j<S.cslots;j++) if(inRect(x,y,counterSlotRect(j))) return j;
  return -1;
}
function liftBundle(x,y){
  const list=[];
  S.sel.forEach(e=>{
    if(e.src==='counter'){
      const sl=S.counter[e.si];
      if(sl&&sl.item===e.item&&!sl.arriving){ S.counter[e.si]=null;
        list.push({item:e.item,src:'counter',si:e.si,sj:-1,misfiled:false}); }
    } else {
      const sh=S.shelves[e.si], sl=sh&&sh.slots[e.sj];
      if(sl&&sl.item===e.item&&!sl.arriving){ sh.slots[e.sj]=null;
        list.push({item:e.item,src:'shelf',si:e.si,sj:e.sj,misfiled:sl.misfiled}); }
    }
  });
  selClear();
  if(!list.length) return false;
  S.drag={bundle:list,item:list[0].item,src:list[0].src,si:list[0].si,sj:list[0].sj,
          misfiled:list[0].misfiled,x:x,y:y,haggle:0,snap:0,hagCust:null,t:0};
  Snd.grab(); return true;
}
function tryPick(x,y,shift){
  selValid();
  if(shift){
    const cj2=counterSlotUnder(x,y);
    if(cj2>=0&&S.counter[cj2]&&!S.counter[cj2].arriving){
      selToggle('counter',cj2,-1,S.counter[cj2].item,false); return true; }
    const ss2=shelfSlotUnder(x,y);
    if(ss2){ const e=S.shelves[ss2.i].slots[ss2.j];
      if(e&&!e.arriving){ selToggle('shelf',ss2.i,ss2.j,e.item,e.misfiled); return true; } }
    return true;
  }
  if(S.sel.length>1){
    const cj3=counterSlotUnder(x,y), ss3=shelfSlotUnder(x,y);
    if((cj3>=0&&selIndex('counter',cj3,-1)>=0)||(ss3&&selIndex('shelf',ss3.i,ss3.j)>=0))
      return liftBundle(x,y);
  }
  selClear();
  const cj=counterSlotUnder(x,y);
  if(cj>=0&&S.counter[cj]&&!S.counter[cj].arriving){
    const e=S.counter[cj];
    S.drag={item:e.item,src:'counter',si:cj,sj:-1,misfiled:false,x:x,y:y,haggle:0,snap:0,hagCust:null,t:0};
    S.counter[cj]=null; Snd.grab(); return true;
  }
  const ss=shelfSlotUnder(x,y);
  if(ss){
    const e=S.shelves[ss.i].slots[ss.j];
    if(e&&!e.arriving){
      S.drag={item:e.item,src:'shelf',si:ss.i,sj:ss.j,misfiled:e.misfiled,x:x,y:y,haggle:0,snap:0,hagCust:null,t:0};
      S.shelves[ss.i].slots[ss.j]=null; Snd.grab(); return true;
    }
  }
  for(let i=0;i<S.shelves.length;i++){
    const r=shelfRect(i);
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+SHELF_HEAD){
      const sh=S.shelves[i];
      if(sh.slots.every(s=>!s)){
        const cats=activeCats();
        sh.cat=cats[(cats.indexOf(sh.cat)+1)%cats.length];
        Snd.ui(); float(r.x+r.w/2,r.y+8,'RELABELLED',CATS[sh.cat].col,14);
      } else { float(r.x+r.w/2,r.y+8,'CLEAR THE SHELF FIRST',C.dim,13); Snd.bad(); }
      return true;
    }
  }
  return false;
}
function returnOne(b){
  if(b.src==='counter'&&!S.counter[b.si]){ S.counter[b.si]={item:b.item,arriving:0,anim:0.6,misfiled:b.misfiled}; return; }
  if(b.src==='shelf'&&S.shelves[b.si]&&!S.shelves[b.si].slots[b.sj]){
    S.shelves[b.si].slots[b.sj]={item:b.item,misfiled:b.misfiled,arriving:0,anim:0.6}; return; }
  const k=freeCounterSlot();
  if(k>=0) S.counter[k]={item:b.item,arriving:0,anim:0.6,misfiled:b.misfiled};
}
function returnBundle(d){ d.bundle.forEach(returnOne); Snd.drop(); }
function resolveBundleDrop(x,y,d){
  const c=custUnder(x,y);
  if(c){
    if(bundleFits(c,d.bundle)){ sellBundle(c,d); return; }
    if(!tutFrozen()) c.pat=Math.max(1.2,c.pat-c.patMax*0.08);
    c.shakeT=0.4;
    if(c.want.kind==='bundle'){ c.line='I said '+c.want.n+' of them.';
      float(c.x+170,c.y+34,'ORDER NOT FILLED',C.red,16); }
    else { c.line='One at a time.'; float(c.x+170,c.y+34,'NOT A BULK BUYER',C.red,16); }
    c.lineT=1.5; Snd.bad(); shake(4); returnBundle(d); return;
  }
  if(inRect(x,y,trashRect())){
    let v=0; d.bundle.forEach(b=> v+=Math.max(1,Math.round(b.item.v*0.25)));
    S.caps+=v; breakCombo();
    const tr=trashRect();
    float(tr.x+tr.w/2,tr.y+10,'+'+v+'c SCRAP',C.dim,16);
    burst(tr.x+tr.w/2,tr.y+40,'#6b5c48',14,140); Snd.drop(); return;
  }
  const row=shelfRowUnder(x,y);
  if(row>=0){
    let placed=0;
    d.bundle.forEach(b=>{
      const j=S.shelves[row].slots.findIndex(sl=>!sl);
      if(j>=0){ placeOnShelf(row,j,{item:b.item,src:b.src,misfiled:b.misfiled}); placed++; }
      else returnOne(b);
    });
    if(!placed){ const rr=shelfRect(row); float(rr.x+rr.w/2,rr.y+8,'SHELF FULL',C.red,15); Snd.bad(); }
    return;
  }
  returnBundle(d);
}
function resolveDrop(x,y){
  const d=S.drag; if(!d) return;
  S.drag=null;
  if(d.bundle){ resolveBundleDrop(x,y,d); return; }
  const c=custUnder(x,y);
  if(c){
    if(wantsMatch(c,d.item)){ sellTo(c,d); return; }
    if(!tutFrozen()) c.pat=Math.max(1.2,c.pat-c.patMax*0.10);
    c.shakeT=0.4;
    c.line='Not what I asked for.'; c.lineT=1.3;
    float(c.x+170,c.y+34,'WRONG ITEM',C.red,18); Snd.bad(); shake(4);
    S.drag=d; returnDrag(); S.drag=null; return;
  }
  if(inRect(x,y,trashRect())){
    const v=Math.max(1,Math.round(d.item.v*0.25));
    S.caps+=v; breakCombo();
    const tr=trashRect();
    float(tr.x+tr.w/2,tr.y+10,'+'+v+'c SCRAP',C.dim,16);
    burst(tr.x+tr.w/2,tr.y+40,'#6b5c48',10,120); Snd.drop(); return;
  }
  const ss=shelfSlotUnder(x,y);
  if(ss&&!S.shelves[ss.i].slots[ss.j]){ S.drag=d; placeOnShelf(ss.i,ss.j,d); S.drag=null; return; }
  const row=shelfRowUnder(x,y);
  if(row>=0){
    const j=S.shelves[row].slots.findIndex(s=>!s);
    if(j>=0){ S.drag=d; placeOnShelf(row,j,d); S.drag=null; return; }
    const rr=shelfRect(row); float(rr.x+rr.w/2,rr.y+8,'SHELF FULL',C.red,15); Snd.bad();
  }
  const cj=counterSlotUnder(x,y);
  if(cj>=0&&!S.counter[cj]){ S.counter[cj]={item:d.item,arriving:0,anim:1,misfiled:false}; Snd.drop(); return; }
  S.drag=d; returnDrag(); S.drag=null; Snd.drop();
}
cv.addEventListener('pointerdown',ev=>{
  ev.preventDefault(); Snd.init();
  const p=toDesign(ev); MX=p.x; MY=p.y;
  for(let i=BTNS.length-1;i>=0;i--){ const b=BTNS[i]; if(inRect(p.x,p.y,b)){ Snd.ui(); b.fn(); return; } }
  if(S.scene==='play'&&!S.paused){
    if(lessonClick()) return;
    tryPick(p.x,p.y,ev.shiftKey);
  }
  if(S.scene==='workshop'){ if(workTutClick()) return; wsPick(p.x,p.y); }
});
cv.addEventListener('pointermove',ev=>{
  const p=toDesign(ev); MX=p.x; MY=p.y;
  if(S.wd){ S.wd.x=p.x; S.wd.y=p.y; }
  if(S.drag){
    S.drag.x=p.x; S.drag.y=p.y;
    const c=custUnder(p.x,p.y);
    if(c&&wantsMatch(c,S.drag.item)){ if(S.drag.hagCust!==c){ S.drag.hagCust=c; S.drag.haggle=0; S.drag.snap=0; } }
    else S.drag.hagCust=null;
  }
});
window.addEventListener('pointerup',ev=>{ const p=toDesign(ev); if(S.wd) wsDrop(p.x,p.y); if(S.drag) resolveDrop(p.x,p.y); });
window.addEventListener('keydown',ev=>{
  if(S.scene==='play'&&!S.paused&&ev.key>='1'&&ev.key<='4'){ fireActive(+ev.key-1); ev.preventDefault(); return; }
  if(ev.key==='Escape'&&S.sel.length){ selClear(); Snd.ui(); ev.preventDefault(); return; }
  if(S.scene==='looks'&&S.editName){
    if(ev.key==='Backspace'){ S.look.sign=(S.look.sign||'').slice(0,-1); saveLook(); ev.preventDefault(); }
    else if(ev.key==='Enter'||ev.key==='Escape'){ S.editName=false; }
    else if(ev.key.length===1&&(S.look.sign||'').length<10){
      const ch=ev.key.toUpperCase();
      if(/[A-Z0-9 '&.\-]/.test(ch)){ S.look.sign=(S.look.sign||'')+ch; saveLook(); }
      ev.preventDefault();
    }
    return;
  }
  if(ev.key==='m'||ev.key==='M') Snd.on=!Snd.on;
  if(ev.key==='Escape'||ev.key===' '){ if(S.scene==='play'){ S.paused=!S.paused; ev.preventDefault(); } }
});

function wrapLines(str,maxw,size){
  g.font='normal '+size+'px '+FONT;
  const words=str.split(' '); let line='', n=1;
  for(const w of words){ const t=line?line+' '+w:w;
    if(g.measureText(t).width>maxw){ n++; line=w; } else line=t; }
  return n;
}

function buildPaperImg(){
  const c=makeCanvas(96,54), x=c.getContext('2d');
  const px=(a,b,w,h,col)=>{ x.fillStyle=col; x.fillRect(a,b,w,h); };
  const sky=['#cdc2aa','#c6bba3','#bdb29a','#b4a991'];
  for(let i=0;i<4;i++) px(0,i*8,96,8,sky[i]);
  for(let dy=-5;dy<=5;dy++){ const w=Math.floor(Math.sqrt(25-dy*dy)); px(70-w,12+dy,w*2+1,1,'#e0d6be'); }
  let rx=0,seed=11;
  while(rx<96){ seed=(seed*1103515245+12345)&0x7fffffff;
    const w=4+(seed>>8)%9, h=6+(seed>>4)%16;
    px(rx,32-h,w,h+2,'#8e8474'); rx+=w+2; }

    px(rx,36-h,w,h+5,'#5e564a');

  return c;
}

    plate(LO.panelL.x,LO.panelL.y,LO.panelL.w,LO.panelL.h,'#241d16','#5c4a37','#7a6247');
    plate(LO.panelR.x,LO.panelR.y,LO.panelR.w,LO.panelR.h,'#241d16','#5c4a37','#7a6247');
    drawShelves(); drawCounter(); drawCustomers(); drawSidePanels();
    drawPerkRail(); drawEffects(); drawBanner(); drawDrag(); drawBot(); drawLesson(); drawPerkTip();
  }
  if(S.scene==='menu') drawMenu();
  else if(S.scene==='dayintro') drawDayIntro();
  else if(S.scene==='report') drawReport();
  else if(S.scene==='shop') drawShop();
  else if(S.scene==='looks') drawLooks();
  else if(S.scene==='ledger') drawLedger();
  else if(S.scene==='paper') drawPaper();
  else if(S.scene==='workshop') drawWorkshop();
  else if(S.scene==='summary') drawSummary();
  else if(S.scene==='gameover') drawGameOver();
  else if(S.scene==='play'&&S.paused) drawPaused();
  if(S.scene!=='menu'&&S.scene!=='gameover') drawHUD();
  if(S.flash>0.01){ g.globalAlpha=S.flash*0.45; g.fillStyle=S.flashCol; g.fillRect(0,0,W,H); g.globalAlpha=1; }
  const vg=g.createRadialGradient(W/2,H/2,H*0.55,W/2,H/2,H*1.15);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.45)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
  g.restore();
}

/* ================================================================
   THE HIRED HAND  -  a second cursor working the counter
   ================================================================ */
const CURSOR_PX=[
'k.......','kk......','kak.....','kaak....','kaaak...','kaaaak..','kaaaaak.',
'kaaakkkk','kaak....','kakak...','kk.kak..','k...kak.','.....kk.'];
const CURSOR_CACHE={}, HAND_SPR={};
function cursorSpr(col){
  if(!CURSOR_CACHE[col]) CURSOR_CACHE[col]=spriteFrom(CURSOR_PX,{k:'#0d1b24',a:col});
  return CURSOR_CACHE[col];
}
function handSprite(h){
  if(!HAND_SPR[h.lvl]) HAND_SPR[h.lvl]=drawChar(h.cfg);
  return HAND_SPR[h.lvl];
}
const BOT={x:470,y:600,tx:470,ty:600,state:'idle',wait:0.8,pause:0,plan:null,drag:null,
           say:'', sold:0, earned:0, filed:0, scrapped:0, mistakes:0};
function botReset(){
  Object.assign(BOT,{x:470,y:600,tx:470,ty:600,state:'idle',wait:1.2,pause:0,plan:null,
    drag:null,say:'',sold:0,earned:0,filed:0,scrapped:0,mistakes:0});
}
function botHome(){ const cb=counterBlock(); return {x:cb.x+cb.w+38,y:cb.y-26}; }
function botGoto(r){ BOT.tx=r.x+r.w/2; BOT.ty=r.y+r.h/2; }
function botPlan(){
  const B=BOT; B.plan=null;
  let best=null;
  for(const c of S.custs){
    if(c.state!=='wait') continue;
    for(let i=0;i<S.shelves.length;i++) for(let j=0;j<4;j++){
      const e=S.shelves[i].slots[j];
      if(e&&!e.arriving&&wantsMatch(c,e.item)&&(!best||c.pat<best.pat))
        best={pat:c.pat,plan:{type:'sell',src:'shelf',si:i,sj:j,cust:c}};
    }
  }
  if(best) B.plan=best.plan;
  if(!B.plan){
    for(const c of S.custs){
      if(c.state!=='wait') continue;
      for(let k=0;k<S.cslots;k++){
        const e=S.counter[k];
        if(e&&!e.arriving&&wantsMatch(c,e.item)){ B.plan={type:'sell',src:'counter',si:k,cust:c}; break; }
      }
      if(B.plan) break;
    }
  }
  if(!B.plan){
    for(let k=0;k<S.cslots;k++){
      const e=S.counter[k];
      if(e&&!e.arriving){ const f=freeShelfSlot(e.item.cat); if(f){ B.plan={type:'file',src:'counter',si:k,to:f}; break; } }
    }
  }
  if(!B.plan&&counterCount()>=S.cslots-1){
    for(let k=0;k<S.cslots;k++){
      const e=S.counter[k];
      if(e&&!e.arriving&&!freeShelfSlot(e.item.cat)){ B.plan={type:'scrap',src:'counter',si:k}; break; }
    }
  }
  if(!B.plan){ const h=botHome(); B.tx=h.x; B.ty=h.y; B.state='idle'; B.wait=0.35; B.say=''; return; }
  const e = B.plan.src==='shelf' ? S.shelves[B.plan.si].slots[B.plan.sj] : S.counter[B.plan.si];
  B.say = B.plan.type==='sell' ? 'serving' : B.plan.type==='file' ? 'filing' : 'scrapping';
  botGoto(B.plan.src==='shelf'?shelfSlotRect(B.plan.si,B.plan.sj):counterSlotRect(B.plan.si));
  B.state='toSource';
}
function botGrab(){
  const B=BOT,p=B.plan,h=hand();
  let e;
  if(p.src==='shelf'){ e=S.shelves[p.si].slots[p.sj]; if(!e||e.arriving) return botIdle(0.1); S.shelves[p.si].slots[p.sj]=null; }
  else { e=S.counter[p.si]; if(!e||e.arriving) return botIdle(0.1); S.counter[p.si]=null; }
  B.drag={item:e.item,src:p.src,misfiled:!!e.misfiled,haggle:0,snap:0,hagCust:null,x:B.x,y:B.y};
  Snd.grab();
  if(p.type==='sell'){
    if(p.cust.state!=='wait') return botStrand();
    const r=custRect(p.cust.row); B.tx=p.cust.x+r.w*0.55; B.ty=p.cust.y+r.h*0.5;
  } else if(p.type==='file'){
    let to=p.to;
    if(Math.random()>h.s){
      const wrong=S.shelves.map((sh,i)=>({i:i,sh:sh})).filter(o=>o.sh.cat!==e.item.cat);
      for(const w of wrong){ const j=w.sh.slots.findIndex(x=>!x); if(j>=0){ to={i:w.i,j:j}; B.mistakes++; break; } }
    }
    p.to=to; botGoto(shelfSlotRect(to.i,to.j));
  } else botGoto(trashRect());
  B.state='toTarget';
}
function botDrop(){
  const B=BOT,p=B.plan;
  if(p.type==='file'){
    if(S.shelves[p.to.i].slots[p.to.j]){
      const f=freeShelfSlot(B.drag.item.cat);
      if(f){ p.to=f; botGoto(shelfSlotRect(f.i,f.j)); B.state='toTarget'; return; }
      return botStrand();
    }
    placeOnShelf(p.to.i,p.to.j,B.drag); B.filed++;
  } else if(p.type==='scrap'){
    const v=Math.max(1,Math.round(B.drag.item.v*0.25));
    S.caps+=v; B.scrapped++; breakCombo();
    const tr=trashRect(); float(tr.x+tr.w/2,tr.y+10,'+'+v+'c',C.dim,14); Snd.drop();
  }
  B.drag=null; botIdle(hand().r);
}
function botIdle(t){ const B=BOT; B.plan=null; B.state='idle'; B.wait=t||0.2; B.pause=0; B.say=''; }
function botStrand(){
  const B=BOT;
  if(B.drag){
    const k=freeCounterSlot();
    if(k>=0) S.counter[k]={item:B.drag.item,arriving:0,anim:1,misfiled:B.drag.misfiled};
    else { S.caps+=Math.max(1,Math.round(B.drag.item.v*0.25)); B.scrapped++; }
    B.drag=null;
  }
  botIdle(0.2);
}
function botTick(dt){
  const B=BOT, h=hand();
  if(!h||S.scene!=='play'||S.paused) return;
  if(B.pause>0) B.pause-=dt;
  const dx=B.tx-B.x, dy=B.ty-B.y, d=Math.hypot(dx,dy);
  if(d>1){ const step=Math.min(d,h.v*dt); B.x+=dx/d*step; B.y+=dy/d*step; }
  const there=d<=7;
  if(B.drag){ B.drag.x=B.x; B.drag.y=B.y; }
  switch(B.state){
    case 'idle': B.wait-=dt; if(B.wait<=0) botPlan(); break;
    case 'toSource': if(there){ B.state='grabbing'; B.pause=h.r*0.55; } break;
    case 'grabbing': if(B.pause<=0) botGrab(); break;
    case 'toTarget':
      if(there){
        if(B.plan.type==='sell'){
          if(B.plan.cust.state!=='wait'){ botStrand(); break; }
          B.state='haggling'; B.drag.haggle=0; B.drag.snap=0; B.drag.hagCust=B.plan.cust;
        } else { B.state='dropping'; B.pause=h.r*0.45; }
      }
      break;
    case 'dropping': if(B.pause<=0) botDrop(); break;
    case 'haggling': {
      const c=B.plan.cust;
      if(c.state!=='wait'){ B.drag.hagCust=null; botStrand(); break; }
      const pm=priceMults();
      B.drag.haggle=Math.min(pm.haggleMax,B.drag.haggle+dt*pm.haggleRate);
      if(B.drag.haggle>=pm.haggleMax*h.aim-0.001){
        const before=S.caps;
        B.drag.bonus=h.bonus||0;
        sellTo(c,B.drag);
        B.earned+=S.caps-before; B.sold++;
        B.drag=null; botIdle(h.r);
      }
      break;
    }
  }
}
function drawBot(){
  const h=hand(); if(!h) return;
  const B=BOT;
  if(B.drag){
    g.fillStyle='rgba(0,0,0,0.32)'; g.fillRect(Math.round(B.x-20),Math.round(B.y+26),40,5);
    drawItem(B.drag.item,B.x,B.y-6,3);
    if(B.drag.hagCust){
      const pm=priceMults(), bw=92;
      bar(B.x-bw/2,B.y-54,bw,9,B.drag.haggle/pm.haggleMax,h.col);
    }
  }
  blit(cursorSpr(h.col),B.x-3,B.y-3,3);
  const nm=h.who;
  const w=txtw(nm,10)+14;
  plate(B.x+16,B.y+20,w,18,'#101a22','#4a7a9a');
  txt(nm,B.x+23,B.y+29,10,h.col);
}
